<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한식 · 한국 음식 문화</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{color-scheme:light;--ink:#202328;--muted:#687079;--green:#0047a0;--green-dark:#00367a;--mint:#edf2f6;--paper:#f8f8f5;--line:#e1e4e6;--white:#fff;--card:#fff;--soft:#f4f5f3;--hero-start:#faf7f4;--hero-end:#f1f5f9;--shadow:0 24px 65px rgba(38,52,66,.12);--glass:rgba(255,255,255,.84);
--cheong:#0047a0;--jeok:#cd2e3a;--hwang:#d8c99a;--baek:#aaa99f;--heuk:#24272b;--on-cheong:#fff;--on-jeok:#fff;--on-hwang:#202328;--on-baek:#202328;--on-heuk:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--ink:#f3f2ef;--muted:#aaaeb3;--green:#8daed4;--green-dark:#b7cae4;--mint:#202a38;--paper:#151719;--line:#34383c;--white:#202326;--card:#1b1e21;--soft:#24272a;--hero-start:#211a1b;--hero-end:#18202a;--shadow:0 24px 65px rgba(0,0,0,.32);--glass:rgba(27,30,33,.84);--cheong:#8daed4;--jeok:#d96b73;--hwang:#cdbf91;--baek:#b0afa7;--heuk:#9a9da1;--on-cheong:#151719;--on-jeok:#151719;--on-hwang:#151719;--on-baek:#151719;--on-heuk:#151719;}}
:root[data-theme="dark"]{color-scheme:dark;--ink:#f3f2ef;--muted:#aaaeb3;--green:#8daed4;--green-dark:#b7cae4;--mint:#202a38;--paper:#151719;--line:#34383c;--white:#202326;--card:#1b1e21;--soft:#24272a;--hero-start:#211a1b;--hero-end:#18202a;--shadow:0 24px 65px rgba(0,0,0,.32);--glass:rgba(27,30,33,.84);--cheong:#8daed4;--jeok:#d96b73;--hwang:#cdbf91;--baek:#b0afa7;--heuk:#9a9da1;--on-cheong:#151719;--on-jeok:#151719;--on-hwang:#151719;--on-baek:#151719;--on-heuk:#151719;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all;overflow-x:hidden;transition:background-color .18s,color .18s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.korean-watermark{position:fixed;inset:0;width:100vw;height:100vh;aspect-ratio:auto;z-index:0;object-fit:contain;opacity:.035;filter:saturate(.8) contrast(.9);pointer-events:none;user-select:none}
@media (min-width:1000px){.korean-watermark{opacity:.045}}
@media (max-width:620px){.korean-watermark{inset:0;width:100vw;height:100vh;opacity:.028}}
:root[data-theme="light"] .korean-watermark{opacity:.045}
:root[data-theme="light"] .korean-watermark{filter:saturate(.9) contrast(.95)}
@media (prefers-reduced-motion:no-preference){.korean-watermark{transform:translateY(0);transition:opacity .5s ease}}
:root[data-theme="dark"] .korean-watermark{opacity:.022}
:root[data-theme="dark"] body,:root:not([data-theme="light"]):not([data-theme="dark"]) body{background:linear-gradient(135deg,#10151f 0%,#17233a 48%,#121821 100%)}
:root[data-theme="dark"] .site-header,:root:not([data-theme="light"]):not([data-theme="dark"]) .site-header{background:rgba(15,21,31,.72);border-bottom-color:rgba(181,204,232,.12);-webkit-backdrop-filter:blur(22px) saturate(1.18);backdrop-filter:blur(22px) saturate(1.18)}
:root[data-theme="dark"] .hero,:root:not([data-theme="light"]):not([data-theme="dark"]) .hero{background:linear-gradient(128deg,rgba(205,46,58,.08),transparent 38%,rgba(0,71,160,.14) 78%),linear-gradient(135deg,var(--hero-start),var(--hero-end))}
:root[data-theme="dark"] .dashboard,:root[data-theme="dark"] .feature-card,:root[data-theme="dark"] .dcard,:root[data-theme="dark"] .mcard,:root[data-theme="dark"] .tally,:root[data-theme="dark"] .dish,:root[data-theme="dark"] .dish-list,:root[data-theme="dark"] .stat,:root[data-theme="dark"] .art-tile,:root:not([data-theme="light"]):not([data-theme="dark"]) .dashboard,:root:not([data-theme="light"]):not([data-theme="dark"]) .feature-card,:root:not([data-theme="light"]):not([data-theme="dark"]) .dcard,:root:not([data-theme="light"]):not([data-theme="dark"]) .mcard,:root:not([data-theme="light"]):not([data-theme="dark"]) .tally,:root:not([data-theme="light"]):not([data-theme="dark"]) .dish,:root:not([data-theme="light"]):not([data-theme="dark"]) .dish-list,:root:not([data-theme="light"]):not([data-theme="dark"]) .stat,:root:not([data-theme="light"]):not([data-theme="dark"]) .art-tile{background:rgba(31,43,61,.68)!important;border-color:rgba(181,204,232,.16)!important;-webkit-backdrop-filter:blur(18px) saturate(1.12);backdrop-filter:blur(18px) saturate(1.12);box-shadow:0 18px 44px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.06)}
:root[data-theme="dark"] .dashboard,:root[data-theme="dark"] .feature-card,:root[data-theme="dark"] .dcard,:root[data-theme="dark"] .mcard,:root[data-theme="dark"] .tally,:root[data-theme="dark"] .dish-list,:root:not([data-theme="light"]):not([data-theme="dark"]) .dashboard,:root:not([data-theme="light"]):not([data-theme="dark"]) .feature-card,:root:not([data-theme="light"]):not([data-theme="dark"]) .dcard,:root:not([data-theme="light"]):not([data-theme="dark"]) .mcard,:root:not([data-theme="light"]):not([data-theme="dark"]) .tally,:root:not([data-theme="light"]):not([data-theme="dark"]) .dish-list{border-radius:16px;border-style:solid}
:root[data-theme="dark"] .inventory-row:hover,:root[data-theme="dark"] .dish-btn:hover,:root[data-theme="dark"] .mtab:hover,:root:not([data-theme="light"]):not([data-theme="dark"]) .inventory-row:hover,:root:not([data-theme="light"]):not([data-theme="dark"]) .dish-btn:hover,:root:not([data-theme="light"]):not([data-theme="dark"]) .mtab:hover{background:rgba(141,174,212,.12)!important}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--green);outline-offset:3px}
h1,h2,h3,p{margin-top:0}
button{font-family:inherit}
.container{width:min(1100px,calc(100% - 40px));margin:0 auto}
.c-cheong{--c:var(--cheong);--on:var(--on-cheong)}.c-jeok{--c:var(--jeok);--on:var(--on-jeok)}.c-hwang{--c:var(--hwang);--on:var(--on-hwang)}.c-baek{--c:var(--baek);--on:var(--on-baek)}.c-heuk{--c:var(--heuk);--on:var(--on-heuk)}
/* header */
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:inline-flex;align-items:center;gap:11px;font-size:1.1rem;font-weight:800;letter-spacing:-.03em}
.brand-mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:var(--green);color:var(--white);font-size:1.2rem}
.nav-links{display:flex;align-items:center;gap:24px;color:var(--muted);font-size:.92rem;font-weight:600}
.nav-links a:hover{color:var(--green)}
.tbtn{min-height:38px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--white);color:var(--ink);cursor:pointer;font-size:.84rem;font-weight:700}
.tbtn:hover{border-color:var(--green);color:var(--green)}
.nav-links .tbtn+.tbtn{margin-left:-10px}
/* hero */
.hero{padding:76px 0 84px;background:radial-gradient(ellipse at 86% 18%,rgba(205,46,58,.09),transparent 24%),radial-gradient(ellipse at 14% 82%,rgba(0,71,160,.09),transparent 28%),linear-gradient(135deg,var(--hero-start),var(--hero-end) 62%)}
.hero-grid{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:64px}
h1{max-width:640px;margin-bottom:20px;font-size:clamp(2.4rem,5.4vw,4.2rem);line-height:1.12;letter-spacing:-.05em}
.hero-copy{max-width:540px;margin-bottom:28px;color:var(--muted);font-size:1.08rem}
.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:8px;background:var(--green);color:var(--white);font-size:.94rem;font-weight:700;transition:background .16s,transform .16s}
.button:hover{background:var(--green-dark);transform:translateY(-1px)}
.dashboard{padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:var(--shadow)}
.dashboard-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.dashboard-title{margin:0;font-size:.96rem;font-weight:800}
.status{padding:5px 10px;border-radius:999px;background:var(--mint);color:var(--green);font-size:.72rem;font-weight:700;white-space:nowrap}
.hero-mid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px;margin-bottom:14px}
.art-tile{display:grid;place-items:center;min-height:150px;padding:14px;border-radius:14px;background:var(--mint);color:color-mix(in srgb,var(--c,var(--green)) 70%,var(--ink))}
.art-tile svg{width:100%;max-width:150px;height:auto}
.stats{display:grid;grid-template-columns:1fr;gap:12px}
.stats.three{grid-template-columns:repeat(3,1fr);margin-top:20px}
.stat{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--white)}
.stat-label{display:block;margin-bottom:4px;color:var(--muted);font-size:.76rem}
.stat-value{display:block;font-size:1.5rem;font-weight:800;letter-spacing:-.04em;line-height:1.2}
.stat-value.sm{font-size:.95rem;font-weight:700;letter-spacing:0;line-height:1.45}
.inventory-list{overflow:hidden;border:1px solid var(--line);border-radius:12px}
.inventory-row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;width:100%;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font-size:.8rem;text-align:left}
.inventory-row:last-child{border-bottom:0}
button.inventory-row{cursor:pointer;transition:background .16s}
button.inventory-row:hover,button.inventory-row[aria-pressed="true"]{background:var(--mint)}
.inventory-head{background:var(--soft);color:var(--muted);font-size:.7rem;font-weight:700}
.product{display:flex;align-items:center;font-weight:700}
.quantity{max-width:12em;color:var(--muted);text-align:right}
.dot{display:inline-block;flex:none;width:9px;height:9px;margin-right:9px;border-radius:50%;background:var(--c)}
/* sections */
.section{padding:82px 0}
.alt{background:var(--white)}
.section-heading{max-width:650px;margin:0 auto 38px;text-align:center}
.eyebrow{margin:0 0 14px;color:var(--green);font-size:.8rem;font-weight:800;letter-spacing:.08em}
.section-heading h2,.about-grid h2{margin-bottom:12px;font-size:clamp(2rem,4vw,2.8rem);line-height:1.2;letter-spacing:-.045em}
.section-heading p:last-child{margin-bottom:0;color:var(--muted)}
/* dish explorer */
.explorer{display:grid;grid-template-columns:280px 1fr;padding:0;overflow:hidden}
.dish-list{display:grid;align-content:start;gap:4px;padding:10px;border-right:1px solid var(--line);background:var(--soft)}
.dish-btn{display:flex;align-items:center;gap:2px;padding:12px 14px;border:0;border-radius:10px;background:none;color:inherit;font-size:1rem;text-align:left;cursor:pointer;transition:background .16s}
.dish-btn:hover{background:var(--mint)}
.dish-btn[aria-pressed="true"]{background:var(--white);box-shadow:0 0 0 1px var(--line)}
.dish-btn b{display:block;font-size:.95rem}
.dish-btn small{color:var(--muted);font-size:.78rem}
.dish{display:grid;grid-template-columns:200px 1fr;align-items:start;gap:30px;padding:32px}
.dish .art-tile{min-height:200px}
.dish h3{margin-bottom:8px;font-size:1.7rem;letter-spacing:-.04em;line-height:1.25}
.dish p{margin-bottom:0;color:var(--muted)}
/* five colors */
.ribbon{display:flex;height:10px;margin-bottom:16px;border-radius:99px;overflow:hidden}
.ribbon i{flex:1;background:var(--c)}
.features{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.feature-card{padding:23px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.alt .feature-card,.alt .mcard{background:var(--soft)}
.swatch{display:grid;place-items:center;width:60px;height:60px;margin-bottom:18px;border-radius:16px;background:var(--c);color:var(--on);font-size:1.8rem;font-weight:800}
.feature-card p{margin:0;color:var(--muted);font-size:.88rem}
.feature-card p::first-line{color:var(--ink);font-weight:700}
/* etiquette */
.about-grid{display:grid;grid-template-columns:.9fr 1.1fr;align-items:start;gap:72px}
.about-grid>div:first-child{position:sticky;top:100px}
.about-grid p{color:var(--muted)}
.workflow{display:grid;gap:16px}
.workflow-item{display:flex;gap:15px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.workflow-item:last-child{padding-bottom:0;border-bottom:0}
.step{flex:0 0 32px;display:grid;width:32px;height:32px;place-items:center;border-radius:50%;background:var(--mint);color:var(--green);font-size:.83rem;font-weight:800}
.workflow .step::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}
.workflow-item h3{margin-bottom:3px;font-size:1.02rem}
.workflow-item p{margin-bottom:0;font-size:.88rem}
/* fermentation */
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;margin:0;padding:0;list-style:none}
.timeline li{position:relative;padding-top:56px}
.timeline .step{position:absolute;top:0;left:0;width:40px;height:40px;background:var(--green);color:var(--white);font-size:.95rem}
.timeline li:not(:last-child)::after{content:"";position:absolute;top:19px;left:52px;right:-16px;height:2px;background:linear-gradient(90deg,var(--green),var(--line))}
.timeline h3{margin-bottom:6px;font-size:1.2rem}
.timeline p{margin:0;color:var(--muted);font-size:.9rem}
/* menu */
.hint{margin:-16px 0 22px;color:var(--muted);font-size:.86rem;text-align:center}
.mtabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:34px}
.mtab{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:var(--white);color:var(--ink);font-size:.88rem;font-weight:700;cursor:pointer;transition:background .16s,color .16s,border-color .16s}
.mtab:hover{border-color:var(--green);color:var(--green)}
.mtab[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--white)}
.mcat+.mcat{margin-top:56px}
.mhead{display:flex;align-items:center;gap:16px}
.mhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.mhead .art{display:grid;place-items:center;flex:none;width:60px;height:60px;padding:10px;border-radius:16px;background:var(--mint);color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.mhead svg{width:100%;height:100%}
.mhead h3{margin:0;font-size:1.5rem;letter-spacing:-.03em}
.mhead p{margin:0;color:var(--muted);font-size:.88rem}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:100px 22px;padding-top:96px}
.dcard{position:relative;padding:0 20px 20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 16%,var(--card)),var(--card) 70%);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.dcard:hover{border-color:var(--c);box-shadow:0 22px 44px -22px color-mix(in srgb,var(--c) 80%,transparent)}
.dcard.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green)}
.shot{display:none;position:relative;z-index:2;margin:-82px -10px -4px;aspect-ratio:4/3}
.has-3d .shot{display:block}
.shot canvas{display:block;width:100%;height:100%;transform-origin:50% 70%;transform:translateY(calc(var(--lift,0)*-14px)) scale(calc(1 + var(--lift,0)*.07));filter:drop-shadow(0 calc(8px + var(--lift,0)*14px) calc(10px + var(--lift,0)*10px) rgba(20,30,25,.22))}
.mi{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;width:100%;padding:6px 0 0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.mi b{font-size:1.1rem;letter-spacing:-.02em}
.mi em{grid-row:1;grid-column:2;padding:3px 11px;border-radius:99px;background:var(--mint);color:var(--green);font-style:normal;font-size:.84rem;font-weight:800;white-space:nowrap}
.mi span{grid-column:1/-1;color:var(--muted);font-size:.86rem;line-height:1.5}
.mi[aria-pressed="true"] b::after{content:" ✓";color:var(--green)}
.dcard.on .mi em{background:var(--green);color:var(--white)}
@media (max-width:1000px){.mgrid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){.mgrid{grid-template-columns:1fr;gap:92px}.shot{margin-top:-74px}}
.mnote{margin:28px 0 0;color:var(--muted);font-size:.85rem;text-align:center}
.tally{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:40;transform:translateX(-50%);display:flex;align-items:center;gap:16px;width:max-content;max-width:calc(100% - 28px);padding:10px 10px 10px 20px;border:1px solid var(--line);border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:.9rem}
.tally[hidden]{display:none}
.tally strong{font-size:1.1rem;letter-spacing:-.02em}
.site-footer{padding:24px 0;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
.tally-on .site-footer{padding-bottom:96px}
.footer-inner{display:flex;justify-content:space-between;gap:24px}
.footer-inner p{margin:0}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:no-preference){
.hero-text>*{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
.hero-text>:nth-child(2){animation-delay:.08s}.hero-text>:nth-child(3){animation-delay:.16s}
.hero-card{animation:rise .8s .2s cubic-bezier(.2,.7,.2,1) both}
.anim path,.anim rect,.anim circle,.anim ellipse{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease forwards}
}
@media (max-width:1000px){.features{grid-template-columns:repeat(3,1fr)}.menu{grid-template-columns:repeat(2,1fr)}.nav-links a{display:none}.nav-links .tbtn+.tbtn{margin-left:0}}
@media (max-width:850px){
.hero-grid,.about-grid,.explorer,.dish{grid-template-columns:1fr}.hero-grid,.about-grid{gap:38px}
.hero{padding:58px 0}.about-grid>div:first-child{position:static}
.dish-list{grid-template-columns:repeat(2,1fr);border-right:0;border-bottom:1px solid var(--line)}
.dish{gap:22px;padding:24px}.dish .art-tile{min-height:150px}
.timeline{grid-template-columns:1fr;gap:26px}
.timeline li{padding:0 0 0 60px}
.timeline li:not(:last-child)::after{top:44px;bottom:-26px;left:19px;right:auto;width:2px;height:auto;background:linear-gradient(180deg,var(--green),var(--line))}
.features{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:620px){.menu{grid-template-columns:1fr}.stats.three{grid-template-columns:1fr}.footer-inner{flex-direction:column}}
@media (max-width:560px){.container{width:min(100% - 28px,1100px)}.nav{min-height:64px}.section{padding:62px 0}.dashboard{padding:15px}.features{grid-template-columns:1fr}.inventory-row{gap:8px;padding:11px 9px}.brand span:last-child{display:none}.hero-mid{grid-template-columns:1fr}.dish-list{grid-template-columns:1fr}.tally{gap:10px;padding-left:14px;font-size:.82rem}}
</style>
</head>
